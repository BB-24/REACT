name: REACT CI Pipeline

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  actions: read
  pull-requests: read
  security-events: write

jobs:
  # ============================================================================
  # Change Detection & Path Filtering
  # ============================================================================
  changes:
    name: Detect Changed Components
    runs-on: ubuntu-latest
    outputs:
      infrastructure: ${{ steps.filter.outputs.infrastructure }}
      functions: ${{ steps.filter.outputs.functions }}
      containers: ${{ steps.filter.outputs.containers }}
      scripts: ${{ steps.filter.outputs.scripts }}
      has_code_changes: ${{ steps.filter.outputs.infrastructure == 'true' || steps.filter.outputs.functions == 'true' || steps.filter.outputs.containers == 'true' || steps.filter.outputs.scripts == 'true' }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Filter Component Paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            infrastructure:
              - 'iac/**'
              - 'src/logic-apps/**'
            functions:
              - 'src/functions/**'
              - 'tests/**'
              - 'pyproject.toml'
            containers:
              - 'src/containers/**'
            scripts:
              - 'src/scripts/**'
              - 'iac/scripts/**'

      - name: Change Summary
        run: |
          echo "=== Component Change Summary ==="
          echo "Infrastructure : ${{ steps.filter.outputs.infrastructure }}"
          echo "Functions      : ${{ steps.filter.outputs.functions }}"
          echo "Containers     : ${{ steps.filter.outputs.containers }}"
          echo "Scripts        : ${{ steps.filter.outputs.scripts }}"
          echo "Has Code Changes: ${{ steps.filter.outputs.has_code_changes }}"

  # ============================================================================
  # Security & Secret Scanning (Runs on all code commits)
  # ============================================================================
  security-scan:
    name: Security & Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ""

      - name: Set up Python for pip-audit
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run pip-audit for Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit
          if [ -f src/functions/requirements.txt ]; then
            pip-audit -r src/functions/requirements.txt
          fi

  # ============================================================================
  # Job 1: Infrastructure Validation & IaC Security
  # ============================================================================
  verify-infrastructure:
    name: Verify Infrastructure (Bicep / ARM)
    needs: changes
    if: needs.changes.outputs.infrastructure == 'true' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Bicep Templates with Azure CLI
        run: |
          echo "Validating all Bicep templates in iac/ directory..."
          az bicep build --file iac/main.bicep
          for bicep_file in iac/modules/*.bicep; do
            if [ -f "$bicep_file" ]; then
              echo "Validating module: $bicep_file"
              az bicep build --file "$bicep_file"
            fi
          done
          echo "All Bicep files validated successfully!"

      - name: Validate ARM and JSON Configurations
        run: |
          echo "Validating JSON schemas and structures..."
          python3 -c "
          import json, glob
          for json_path in glob.glob('iac/**/*.json', recursive=True) + glob.glob('src/logic-apps/**/*.json', recursive=True):
              with open(json_path) as f:
                  json.load(f)
              print(f'Valid JSON: {json_path}')
          "

      - name: Run Checkov IaC Security Scanner
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: iac/
          framework: bicep,arm
          soft_fail: true
          output_format: cli,sarif
          output_file_path: checkov-results.sarif

  # ============================================================================
  # Job 2: Python Linting & Code Quality Gate
  # ============================================================================
  lint-python:
    name: Lint & Format Python Code
    needs: changes
    if: needs.changes.outputs.functions == 'true' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Linting Tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff flake8

      - name: Run Ruff Linter
        run: ruff check src/functions tests

      - name: Run Ruff Format Check
        run: ruff format --check src/functions tests

      - name: Run Flake8 Code Style Check
        run: flake8 src/functions tests --count --select=E9,F63,F7,F82 --show-source --statistics

  # ============================================================================
  # Job 3: Python Unit Tests & Coverage (Matrix)
  # ============================================================================
  test-python-functions:
    name: Unit Tests (Python ${{ matrix.python-version }})
    needs: [changes, lint-python]
    if: needs.changes.outputs.functions == 'true' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: src/functions/requirements.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov pytest-mock
          if [ -f src/functions/requirements.txt ]; then
            pip install -r src/functions/requirements.txt
          fi

      - name: Run Pytest with Coverage
        run: |
          export PYTHONPATH="${GITHUB_WORKSPACE}:${GITHUB_WORKSPACE}/src:${GITHUB_WORKSPACE}/src/functions"
          pytest --junitxml=junit/test-results-${{ matrix.python-version }}.xml

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-python-${{ matrix.python-version }}
          path: junit/test-results-${{ matrix.python-version }}.xml

      - name: Upload Coverage Report
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-xml
          path: coverage.xml

  # ============================================================================
  # Job 4: Container Build & Vulnerability Scan
  # ============================================================================
  build-forensic-container:
    name: Build Container & Vulnerability Scan
    needs: changes
    if: needs.changes.outputs.containers == 'true' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./src/containers/forensic-analyzer
          push: false
          load: true
          tags: dfir-sift-analyzer:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan Image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: dfir-sift-analyzer:${{ github.sha }}
          format: sarif
          output: trivy-results.sarif
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

      - name: Upload Trivy Scan Results to GitHub Security
        if: >
          always() &&
          (
            github.event_name != 'pull_request' ||
            github.event.pull_request.head.repo.full_name == github.repository
          )
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
          category: trivy-container-analysis

      - name: Upload Trivy SARIF Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-container-scan-results
          path: trivy-results.sarif

  # ============================================================================
  # Job 5: Shell & Automation Scripts Verification
  # ============================================================================
  verify-scripts:
    name: Verify Automation Scripts
    needs: changes
    if: needs.changes.outputs.scripts == 'true' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Shell Script Syntax
        run: |
          echo "Checking shell script syntax across repository..."
          shopt -s nullglob globstar
          SH_FILES=(src/scripts/**/*.sh iac/scripts/**/*.sh)
          if [ ${#SH_FILES[@]} -gt 0 ]; then
            for script in "${SH_FILES[@]}"; do
              if [ -f "$script" ]; then
                echo "Validating: $script"
                bash -n "$script"
              fi
            done
            echo "All shell scripts passed syntax check."
          else
            echo "No shell scripts found to validate."
          fi

  # ============================================================================
  # Final Pipeline Status Gate
  # ============================================================================
  pipeline-result:
    name: Pipeline Status Gate
    needs:
      - changes
      - security-scan
      - verify-infrastructure
      - lint-python
      - test-python-functions
      - build-forensic-container
      - verify-scripts
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate CI Gate Results
        run: |
          echo "=========================================="
          echo "      REACT CI PIPELINE STATUS GATE       "
          echo "=========================================="
          echo "Security Scan       : ${{ needs.security-scan.result }}"
          echo "Verify Infrastructure: ${{ needs.verify-infrastructure.result }}"
          echo "Lint Python         : ${{ needs.lint-python.result }}"
          echo "Test Python Functions: ${{ needs.test-python-functions.result }}"
          echo "Build Container     : ${{ needs.build-forensic-container.result }}"
          echo "Verify Scripts      : ${{ needs.verify-scripts.result }}"
          echo "=========================================="
          
          RESULTS=(
            "${{ needs.security-scan.result }}"
            "${{ needs.verify-infrastructure.result }}"
            "${{ needs.lint-python.result }}"
            "${{ needs.test-python-functions.result }}"
            "${{ needs.build-forensic-container.result }}"
            "${{ needs.verify-scripts.result }}"
          )
          
          for res in "${RESULTS[@]}"; do
            if [ "$res" == "failure" ] || [ "$res" == "cancelled" ]; then
              echo "GATE STATUS: FAILED (One or more required jobs failed or were cancelled)"
              exit 1
            fi
          done
          
          echo "GATE STATUS: PASSED - All verified jobs succeeded or were cleanly skipped on non-code changes."
