name: REACT

# The pipeline triggers on Pull Requests to the main branch
on:
  pull_request:
    branches:
      - main

jobs:
  # ==========================================
  # PERSON 1: Infrastructure & Orchestration
  # ==========================================
  verify-infrastructure:
    name: Verify IaC (Bicep/ARM)
    runs-on: ubuntu-latest
    # Only run this job if files in the iac/ or logic-apps/ folder change
    if: contains(github.event.pull_request.changed_files, 'iac/') || contains(github.event.pull_request.changed_files, 'src/logic-apps/')
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Lint Bicep Files
        run: |
          echo "Running Azure Bicep Linter..."
          # az bicep build --file iac/main.bicep (Uncomment when Bicep file is ready)
          echo "Infrastructure validation passed!"

  # ==========================================
  # PERSON 2: Python Functions & Scripts
  # ==========================================
  test-python-functions:
    name: Test Azure Functions
    runs-on: ubuntu-latest
    # Only run this job if files in the functions/ folder change
    if: contains(github.event.pull_request.changed_files, 'src/functions/')
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest
          if [ -f src/functions/requirements.txt ]; then pip install -r src/functions/requirements.txt; fi

      - name: Lint with flake8
        run: |
          # Stop the build if there are syntax errors or undefined names
          flake8 src/functions/ --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run Unit Tests
        run: |
          echo "Running Pytest..."
          # pytest src/functions/ (Uncomment when test files are written)
          echo "Python tests passed!"

  # ==========================================
  # PERSON 3: Docker Containers & Analysis
  # ==========================================
  build-forensic-container:
    name: Build SIFT Docker Image
    runs-on: ubuntu-latest
    # Only run this job if files in the containers/ folder change
    if: contains(github.event.pull_request.changed_files, 'src/containers/')
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: |
          echo "Building forensic-analyzer image..."
          docker build -t dfir-sift-analyzer:latest ./src/containers/forensic-analyzer/
          echo "Docker build successful!"