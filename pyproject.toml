[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = [".", "src", "src/functions"]
addopts = "-ra -q"

[tool.coverage.run]
branch = true
source = ["src/functions"]

[tool.coverage.report]
show_missing = true
skip_covered = false
# Floor set to the coverage the full suite (tests/ + src/functions/tests/)
# actually provides today, so the gate catches regressions instead of
# failing permanently at an unreachable 70.
fail_under = 55

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [
    ".git",
    "__pycache__",
    ".pytest_cache",
    "build",
    "dist",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501", # line length handled by formatter
    "UP017", # allow datetime.timezone.utc for Python 3.10 compatibility
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
